<style>
  :root{
    /* colores de Lexicon: --color-white / --color-dark / --color-primary de cada skin */
    --bg:#FFFFFF;
    --fg:#272833;
    --primary:#0B5FFF;
    --tiger:#F40B0F;             /* solo el hover del tigre, como en el portfolio */
    --ease:cubic-bezier(.22,1,.36,1);
    /* mismas medidas que la cabecera del portfolio: lienzo de 1280, congelado en 1440 */
    --w:min(100vw,1440px);
    --u:calc(var(--w) / 1280);
    --icon:clamp(96px, 14vw, 200px);
    --gap:clamp(56px, 8vw, 128px);
    color-scheme:light;
  }
  :root[data-mode="dark"]{
    --bg:#111116;
    --fg:#F1F2F5;
    --primary:#6198FF;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{font-family:'Geist Mono',ui-monospace,monospace;font-weight:400;
    -webkit-font-smoothing:antialiased;overflow:hidden;
    transition:background-color .3s ease,color .3s ease}
  html.safari svg g[filter]{filter:none !important}

  /* ---------- cabecera: tigre (tamaño del index del portfolio) + modos ---------- */
  .site-header{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:10;
    width:var(--w);display:flex;align-items:center;justify-content:center;
    padding:calc(var(--u) * 64) calc(var(--u) * 77) 0}
  /* el tigre mide lo mismo que una línea de los botones (40 × 1.3) */
  .back{display:block;height:max(21px, calc(var(--u) * 52))}
  .back svg{display:block;height:100%;width:auto}
  .back svg path{fill:var(--fg);transition:fill .2s ease}
  .back:hover svg path{fill:var(--tiger)}

  /* botones del portfolio: `>` colgando al hover y bloque que barre e invierte el texto */
  /* tigre y botones juntos, centrados; el hueco deja sitio al `>` del primero */
  .site-header{gap:1.5em;font-size:max(16px, calc(var(--u) * 40))}
  .modes{display:flex;gap:1em;   /* deja sitio al `>` que cuelga a la izquierda */
    font-size:max(16px, calc(var(--u) * 40));line-height:1.3}
  .lnk{position:relative;display:inline-block;background:transparent;border:0;
    font:inherit;color:var(--fg);text-transform:lowercase;cursor:pointer;
    opacity:.4;transition:opacity .2s ease}
  .lnk::before{content:">";position:absolute;right:100%;margin-right:.12em;
    color:var(--primary);opacity:0;transition:opacity .2s ease}
  .lnk[aria-pressed="true"]{opacity:1;color:var(--primary)}
  .lnk[aria-pressed="true"]::before{opacity:1}
  .u-line{--hl:var(--primary);padding-inline:.06em;margin-inline:-.06em}
  .u-line::after{content:attr(data-text);position:absolute;inset:0;
    padding-inline:.06em;background:var(--hl);color:var(--bg);
    pointer-events:none;clip-path:inset(0 100% 0 0);transition:clip-path .26s var(--ease)}
  .lnk:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
  @media (hover:hover) and (pointer:fine){
    .lnk:hover{opacity:1}
    .lnk:hover::before{opacity:1}
    .u-line:hover::after{clip-path:inset(0 0 0 0)}
  }

  /* ---------- carrusel: avanza solo y se arrastra con scroll, rueda o dedo ---------- */
  main{height:100vh;height:100svh;display:flex;align-items:center}
  .mq{width:100%;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .mq.is-drag{cursor:grabbing}
  .mq-track{display:flex;width:max-content;will-change:transform}
  .mq-list{display:flex;list-style:none;flex:none}
  .mq-item{padding:40px calc(var(--gap) / 2)}
  .mq-icon{width:var(--icon);height:var(--icon);fill:currentColor;display:block;
    transition:color .2s ease,transform .4s var(--ease)}
  @media (hover:hover) and (pointer:fine){
    .mq:not(.is-drag) .mq-item:hover .mq-icon{color:var(--primary);transform:scale(1.06)}
  }

  /* ---------- cursor + tooltip (los del portfolio) ---------- */
  .cursor,.cursor-tag{display:none}
  @media (pointer:fine){
    html,body,a,button,[data-cursor],.lnk,.mq{cursor:none}
    .cursor{display:block;position:fixed;left:0;top:0;width:min(4vw,54px);height:min(4vw,54px);
      border-radius:50%;background:var(--primary);opacity:.9;pointer-events:none;z-index:10000;
      transform:translate3d(-200px,-200px,0) translate(-50%,-50%);will-change:transform}
    body.over-tag .cursor{display:none}
    .cursor-tag{position:fixed;left:0;top:0;pointer-events:none;z-index:10001;
      transform:translate3d(-400px,0,0);will-change:transform}
    .cursor-tag .ic{position:absolute;left:0;top:0;width:min(4.5vw,72px);transform:translate(-30%,-24%) translateZ(0)}
    .cursor-tag .ic svg{display:block;width:100%;height:auto}
    .cursor-tag .tag{position:absolute;left:min(2vw,34px);top:min(2.8vw,46px);
      background:var(--tagbg, var(--primary));color:var(--bg);text-transform:uppercase;
      font-family:'Geist Mono',monospace;font-size:clamp(12px,1.6vw,26px);line-height:1.3;
      padding:0 4px;white-space:nowrap}
    .cursor-tag .tag:empty{display:none}
    body.over-tag .cursor-tag{display:block}
  }

  /* ---------- cortina entre páginas ---------- */
  .wipe{position:fixed;top:0;left:0;width:100%;height:100%;
    background:#10DAF9;transform:translateX(-101%);z-index:99999;pointer-events:none}
  .wipe.anim{transition:transform .45s cubic-bezier(.7,0,.3,1)}
  .wipe.cover{transform:translateX(0)}

  /* móvil: lienzo de 375, como el portfolio */
  @media (max-width:700px){
    :root{--m:calc(min(100vw,480px) / 390)}   /* lienzo móvil del portfolio */
    .site-header{width:100%;padding:calc(var(--m) * 32) calc(var(--m) * 24) 0}
    .back{height:calc(var(--m) * 42)}
    .site-header,.modes{font-size:calc(var(--m) * 32)}
  }
</style>
</head>

<script>
(function () {
  var ua = navigator.userAgent;
  if (/Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua)) document.documentElement.classList.add('safari');

  /* ---------- modo claro / oscuro ---------- */
  var root = document.documentElement;
  var btns = [].slice.call(document.querySelectorAll('[data-set]'));
  function sync() {
    var m = root.getAttribute('data-mode');
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.set === m)); });
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      root.setAttribute('data-mode', b.dataset.set);
      try { localStorage.setItem('diegoalo-icons-mode', b.dataset.set); } catch (e) {}
      sync();
    });
  });
  sync();

  /* ---------- carrusel ----------
     Avanza solo a 110 px/s. La rueda y el trackpad lo empujan (en vertical u
     horizontal), y con el ratón o el dedo se arrastra y sale lanzado. Con el
     cursor encima frena hasta parar, para poder leer el tooltip. */
  var mq = document.querySelector('.mq');
  var track = mq.querySelector('.mq-track');
  var list = track.querySelector('.mq-list');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BASE = reduce ? 0 : 110;
  var W = 1, x = 0, speed = BASE, push = 0, hover = false, drag = null, last = performance.now();

  function measure() { W = list.getBoundingClientRect().width || 1; }
  measure();
  window.addEventListener('resize', measure);
  if (document.fonts) document.fonts.ready.then(measure);

  function frame(now) {
    var dt = Math.min((now - last) / 1000, .05); last = now;
    speed += ((hover || drag ? 0 : BASE) - speed) * Math.min(dt * 4, 1);
    var step = push * Math.min(dt * 10, 1);   /* el empujón se reparte en unos frames */
    push -= step;
    if (!drag) x -= speed * dt + step;
    x = ((x % W) - W) % W;                    /* siempre en (-W, 0] */
    track.style.transform = 'translate3d(' + x + 'px,0,0)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (e.deltaMode === 1) d *= 32;
    push += d;
  }, { passive: false });

  mq.addEventListener('mouseenter', function () { hover = true; });
  mq.addEventListener('mouseleave', function () { hover = false; });

  mq.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    drag = { px: e.clientX, t: performance.now(), v: 0, moved: 0 };
    mq.setPointerCapture(e.pointerId);
  });
  mq.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var now = performance.now(), dx = e.clientX - drag.px;
    x += dx; drag.moved += Math.abs(dx);
    drag.v = dx / Math.max(now - drag.t, 1) * 16;   /* px por frame */
    drag.px = e.clientX; drag.t = now;
    if (drag.moved > 4) mq.classList.add('is-drag');
  });
  function release(e) {
    if (!drag) return;
    push -= drag.v * 12;                              /* inercia al soltar */
    drag = null; mq.classList.remove('is-drag');
    if (e.pointerType !== 'mouse') hover = false;     /* en táctil no hay mouseleave */
  }
  mq.addEventListener('pointerup', release);
  mq.addEventListener('pointercancel', release);

  /* ---------- cursor + tooltip (copiado del portfolio) ---------- */
  if (matchMedia('(pointer:fine)').matches) {
    var cur = document.querySelector('.cursor'), tag = document.querySelector('.cursor-tag');
    var tagText = tag.querySelector('.tag');
    var mx = -400, my = 0, pending = false, overEl = null;
    function draw() {
      pending = false;
      cur.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0) translate(-50%,-50%)';
      tag.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
    }
    function show(el) {
      if (el === overEl) return;
      overEl = el;
      if (!el) { document.body.classList.remove('over-tag'); return; }
      tagText.textContent = el.getAttribute('data-cursor');
      var hl = getComputedStyle(el).getPropertyValue('--hl').trim();
      if (hl) tagText.style.setProperty('--tagbg', hl); else tagText.style.removeProperty('--tagbg');
      document.body.classList.add('over-tag');
    }
    /* el carrusel se mueve bajo el ratón quieto, así que se mira qué hay debajo
       en cada movimiento y en cada frame, no solo en mouseover */
    function probe() {
      var el = document.elementFromPoint(mx, my);
      el = el && el.closest ? el.closest('[data-cursor]') : null;
      show(mq.classList.contains('is-drag') ? null : el);
    }
    window.addEventListener('mousemove', function (e) {
      mx = e.clientX; my = e.clientY;
      if (!pending) { pending = true; requestAnimationFrame(function () { draw(); probe(); }); }
    }, { passive: true });
    document.addEventListener('mouseleave', function () { show(null); });
    (function tick() { if (overEl || hover) probe(); requestAnimationFrame(tick); })();
  }

  /* ---------- cortina ---------- */
  var wipe = document.querySelector('.wipe');
  document.querySelectorAll('a[data-wipe]').forEach(function (link) {
    link.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      wipe.style.background = link.dataset.wipe;
      wipe.classList.add('anim', 'cover');
      setTimeout(function () { window.location.href = link.href; }, 460);
    });
  });
  window.addEventListener('pageshow', function () { wipe.classList.remove('anim', 'cover'); });
})();
</script>
